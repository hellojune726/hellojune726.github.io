<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="uptake-title uptake-desc"><title id="uptake-title">Humid air drives water uptake in a hygroscopic glycerol droplet</title><desc id="uptake-desc">Water vapor enters a deuterated glycerol droplet at its surface. Diffusion and buoyancy redistribute water, and orientation changes layering. The illustrated concentration gradient is conceptual. Neutron contrast measures water-content maps and profiles.</desc><defs><marker id="uptake-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#277782"/></marker><linearGradient id="uptake-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#277782"/><stop offset=".52" stop-color="#77b1b2"/><stop offset="1" stop-color="#eab85c"/></linearGradient></defs><rect width="900" height="340" rx="12" fill="#f5f9fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#233d50"><text x="28" y="33" font-size="23" fill="#233d50" font-weight="600">Water-vapor uptake</text><text x="28" y="57" font-size="14" fill="#597382">Hygroscopic glycerol droplet + humid air</text><text x="248" y="95" font-size="16" fill="#233d50" font-weight="600" text-anchor="middle">Humid air · H₂O vapor</text><circle cx="100" cy="123" r="6" fill="#6fadb9"/><circle cx="143" cy="112" r="5" fill="#6fadb9"/><circle cx="202" cy="129" r="5" fill="#6fadb9"/><circle cx="265" cy="112" r="6" fill="#6fadb9"/><circle cx="328" cy="128" r="5" fill="#6fadb9"/><circle cx="390" cy="113" r="5" fill="#6fadb9"/><path d="M157 261C157 199 198 161 249 161C300 161 341 199 341 261Z" fill="url(#uptake-gradient)" stroke="#233d50" stroke-width="2"/><rect x="139" y="264" width="220" height="9" rx="2" fill="#879aa5"/><path d="M201 139L213 172" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#uptake-arrow)"/><path d="M265 127L258 153" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#uptake-arrow)"/><path d="M331 140L311 181" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#uptake-arrow)"/><text x="249" y="297" font-size="13" fill="#597382" text-anchor="middle">Deuterated glycerol on a substrate</text><path d="M329 179L414 137H435M307 230L414 215H435" stroke="#597382" stroke-width="1.4" fill="none"/><text x="445" y="132" font-size="17" fill="#233d50" font-weight="600">Surface uptake</text><text x="445" y="152" font-size="13" fill="#597382">Water enters from the air</text><text x="445" y="210" font-size="17" fill="#233d50" font-weight="600">Internal redistribution</text><text x="445" y="230" font-size="13" fill="#597382">Diffusion + buoyancy</text><path d="M565 82V106" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#uptake-arrow)"/><text x="578" y="102" font-size="12" fill="#597382">Gravity</text><rect x="644" y="101" width="228" height="102" rx="7" fill="#e7f1f3" stroke="#afc6ce"/><text x="659" y="126" font-size="12" fill="#277782" font-weight="600">NEUTRON H–D CONTRAST</text><text x="659" y="152" font-size="13" fill="#233d50">Readout: water-content maps</text><text x="659" y="173" font-size="13" fill="#233d50">and vertical concentration</text><text x="659" y="192" font-size="13" fill="#233d50">profiles over time</text><circle cx="652" cy="246" r="6" fill="#277782"/><circle cx="652" cy="274" r="6" fill="#eab85c"/><text x="668" y="251" font-size="12" fill="#597382">More absorbed water</text><text x="668" y="279" font-size="12" fill="#597382">Less absorbed water</text><text x="445" y="276" font-size="12" fill="#597382">Layering depends on orientation</text><text x="28" y="321" font-size="12" fill="#597382">Conceptual schematic · measured images are shown separately.</text></g></svg>