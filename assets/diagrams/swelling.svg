<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="swelling-title swelling-desc"><title id="swelling-title">PDMS sphere swelling in a deuterated solvent bath</title><desc id="swelling-desc">A dry PDMS sphere absorbs THF-d8. During swelling the outside can become solvent-rich while the core remains solvent-poor. Neutron radiography and Abel reconstruction measure radial solvent fraction. Diagram is conceptual.</desc><defs><marker id="swelling-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#277782"/></marker><linearGradient id="swelling-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#277782"/><stop offset=".52" stop-color="#77b1b2"/><stop offset="1" stop-color="#eab85c"/></linearGradient></defs><rect width="900" height="340" rx="12" fill="#f5f9fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#233d50"><text x="28" y="33" font-size="23" fill="#233d50" font-weight="600">Polymer swelling</text><text x="28" y="57" font-size="14" fill="#597382">PDMS sphere + deuterated solvent (THF-d₈)</text><text x="132" y="94" font-size="16" fill="#233d50" font-weight="600" text-anchor="middle">Dry polymer</text><circle cx="132" cy="169" r="49" fill="#eab85c" stroke="#b58336" stroke-width="2"/><text x="132" y="248" font-size="14" fill="#597382" text-anchor="middle">Initially solvent-poor</text><path d="M206 168H313" stroke="#277782" stroke-width="3" fill="none" marker-end="url(#swelling-arrow)"/><text x="260" y="137" font-size="14" fill="#233d50" text-anchor="middle">Solvent uptake</text><rect x="333" y="87" width="250" height="181" rx="5" fill="#dceef1" stroke="#afc6ce" stroke-width="2"/><text x="459" y="110" font-size="13" fill="#597382" text-anchor="middle">Solvent bath</text><circle cx="458" cy="179" r="63" fill="#277782" stroke="#233d50" stroke-width="1.5"/><circle cx="458" cy="179" r="43" fill="#eab85c" stroke="#fbfbf9" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M372 179H390" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#swelling-arrow)"/><path d="M458 251V247" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#swelling-arrow)"/><text x="459" y="289" font-size="13" fill="#597382" text-anchor="middle">Swelling changes size + internal composition</text><path d="M509 144L604 119H626M476 184L604 177H626" stroke="#597382" stroke-width="1.4" fill="none"/><circle cx="509" cy="144" r="3" fill="#597382"/><circle cx="476" cy="184" r="3" fill="#597382"/><text x="635" y="116" font-size="17" fill="#233d50" font-weight="600">Solvent-rich shell</text><text x="635" y="136" font-size="13" fill="#597382">Uptake starts at the surface</text><text x="635" y="177" font-size="17" fill="#233d50" font-weight="600">Solvent-poor core</text><text x="635" y="197" font-size="13" fill="#597382">Internal transport takes time</text><rect x="629" y="222" width="244" height="68" rx="7" fill="#e7f1f3" stroke="#afc6ce"/><text x="644" y="244" font-size="12" fill="#277782" font-weight="600">NEUTRON RADIOGRAPHY</text><text x="644" y="263" font-size="14" fill="#233d50">+ Abel reconstruction</text><text x="644" y="281" font-size="12" fill="#597382">Readout: radial solvent fraction</text><text x="28" y="321" font-size="12" fill="#597382">Conceptual schematic · measured images are shown separately.</text></g></svg>