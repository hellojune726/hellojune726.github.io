<svg xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-labelledby="wcnr-step3-title wcnr-step3-desc">
<title id="wcnr-step3-title">Infer hydrogen fraction profiles and compare capillary orientations</title><desc id="wcnr-step3-desc">Known capillary path length and neutron attenuation yield the hydrogen fraction H divided by H plus D. Conceptual capillaries compare a top-open hydrogen gradient with a more uniform bottom-open profile caused by mixing. No measured data or calibration values are drawn.</desc>
<defs><marker id="wcnr-step3-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#277782"/></marker><linearGradient id="wcnr-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#277782"/><stop offset="1" stop-color="#d8e8ed"/></linearGradient></defs>
<rect width="400" height="270" rx="12" fill="#f4f8fa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243846"><text x="200" y="27" font-size="20" font-weight="600" text-anchor="middle" fill="#243846">Transmission + path length</text><path d="M200 35L200 48" fill="none" stroke="#277782" stroke-width="2.2" marker-end="url(#wcnr-step3-arrow)"/><text x="200" y="71" font-size="21" font-weight="600" text-anchor="middle" fill="#243846">H/(H+D) profiles</text><text x="103" y="103" font-size="18" font-weight="400" text-anchor="middle" fill="#243846">Top open</text><text x="290" y="103" font-size="18" font-weight="400" text-anchor="middle" fill="#243846">Bottom open</text><rect x="85" y="122" width="35" height="73" fill="url(#wcnr-gradient)"/><path d="M81 115V199H124V115" fill="none" stroke="#243846" stroke-width="3"/><rect x="272" y="122" width="35" height="73" fill="#88b9c6"/><path d="M268 199V115H311V199" fill="none" stroke="#243846" stroke-width="3"/><path d="M289 134C303 135 303 181 289 183C275 181 275 153 283 145" fill="none" stroke="#277782" stroke-width="2" marker-end="url(#wcnr-step3-arrow)"/><path d="M200 128L200 178" fill="none" stroke="#277782" stroke-width="2.2" marker-end="url(#wcnr-step3-arrow)"/><text x="200" y="117" font-size="18" font-weight="400" text-anchor="middle" fill="#243846">g</text><text x="103" y="225" font-size="18" font-weight="600" text-anchor="middle" fill="#243846">Gradient</text><text x="290" y="225" font-size="18" font-weight="600" text-anchor="middle" fill="#243846">Mixed</text><text x="200" y="254" font-size="15" font-weight="400" text-anchor="middle" fill="#5b7180">Conceptual readout · see measured maps</text></g></svg>