<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="porous-title porous-desc"><title id="porous-title">Imbibition and evaporation in a porous gypsum specimen</title><desc id="porous-desc">Liquid enters a porous gypsum specimen from a reservoir. Capillary uptake moves the wetting front upward while evaporation occurs at exposed material. Neutron radiography measures front position and liquid distributions, comparing silicone oil and hexane. The diagram is conceptual.</desc><defs><marker id="porous-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#277782"/></marker><linearGradient id="porous-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#277782"/><stop offset=".52" stop-color="#77b1b2"/><stop offset="1" stop-color="#eab85c"/></linearGradient></defs><rect width="900" height="340" rx="12" fill="#f5f9fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#233d50"><text x="28" y="33" font-size="23" fill="#233d50" font-weight="600">Liquid transport in porous materials</text><text x="28" y="57" font-size="14" fill="#597382">Gypsum specimen · nonvolatile silicone oil / volatile hexane</text><defs><clipPath id="porous-solid"><rect x="189" y="124" width="116" height="146" rx="3"/></clipPath></defs><rect x="189" y="124" width="116" height="146" rx="3" fill="#eaddc7" stroke="#233d50" stroke-width="2"/><rect x="188" y="197" width="120" height="78" fill="#82b7c0" clip-path="url(#porous-solid)"/><circle cx="204" cy="139" r="5" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="230" cy="133" r="4" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="258" cy="145" r="7" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="282" cy="137" r="5" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="214" cy="166" r="6" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="240" cy="174" r="5" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="280" cy="166" r="7" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="204" cy="194" r="4" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="267" cy="192" r="5" fill="#edf1ec" stroke="#bea885" stroke-width="1"/><circle cx="224" cy="218" r="6" fill="#d9edf0" stroke="#5c9aaa" stroke-width="1"/><circle cx="277" cy="220" r="7" fill="#d9edf0" stroke="#5c9aaa" stroke-width="1"/><circle cx="201" cy="242" r="5" fill="#d9edf0" stroke="#5c9aaa" stroke-width="1"/><circle cx="247" cy="239" r="6" fill="#d9edf0" stroke="#5c9aaa" stroke-width="1"/><circle cx="287" cy="250" r="5" fill="#d9edf0" stroke="#5c9aaa" stroke-width="1"/><path d="M171 197H322" stroke="#277782" stroke-width="2" stroke-dasharray="6 4"/><path d="M77 258V285H420V258" stroke="#233d50" stroke-width="2" fill="none"/><path d="M78 263H419V284H78Z" fill="#9ecbd3"/><path d="M79 263H419" stroke="#277782" stroke-width="2"/><path d="M151 239V209" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#porous-arrow)"/><text x="64" y="196" font-size="12" fill="#597382">Capillary</text><text x="64" y="212" font-size="12" fill="#597382">uptake</text><path d="M212 118C194 105 191 99 198 84" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#porous-arrow)"/><path d="M257 115C275 103 277 94 268 84" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#porous-arrow)"/><circle cx="196" cy="74" r="4" fill="#74aab8"/><circle cx="271" cy="74" r="4" fill="#74aab8"/><circle cx="233" cy="85" r="3" fill="#74aab8"/><text x="334" y="104" font-size="17" fill="#233d50" font-weight="600">Evaporation</text><text x="334" y="125" font-size="13" fill="#597382">from exposed material</text><path d="M276 93L320 104" stroke="#597382" stroke-width="1.4"/><path d="M313 197H363M306 237H363" stroke="#597382" stroke-width="1.4"/><text x="373" y="198" font-size="16" fill="#233d50" font-weight="600">Wetting front</text><text x="373" y="239" font-size="14" fill="#233d50">Liquid-rich region</text><text x="253" y="301" font-size="13" fill="#597382" text-anchor="middle">Liquid reservoir</text><rect x="632" y="117" width="240" height="110" rx="7" fill="#e7f1f3" stroke="#afc6ce"/><text x="647" y="144" font-size="12" fill="#277782" font-weight="600">NEUTRON RADIOGRAPHY</text><text x="647" y="171" font-size="14" fill="#233d50">Readout: front position</text><text x="647" y="193" font-size="14" fill="#233d50">and liquid distribution</text><text x="647" y="214" font-size="14" fill="#233d50">inside the pore space</text><text x="632" y="263" font-size="12" fill="#597382">Compare volatile and nonvolatile</text><text x="632" y="282" font-size="12" fill="#597382">liquids to examine evaporation.</text><text x="28" y="321" font-size="12" fill="#597382">Conceptual schematic · measured images are shown separately.</text></g></svg>