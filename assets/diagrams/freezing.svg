<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="freezing-title freezing-desc"><title id="freezing-title">A solution droplet freezes on a cold substrate and develops internal features</title><desc id="freezing-desc">An ice front moves upward through a solution droplet cooled from below. Synchrotron radiography follows front motion and tomography resolves frozen internal geometry. Branches are schematic structural features; their physical state is not assigned.</desc><defs><marker id="freezing-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#277782"/></marker><linearGradient id="freezing-gradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#277782"/><stop offset=".52" stop-color="#77b1b2"/><stop offset="1" stop-color="#eab85c"/></linearGradient></defs><rect width="900" height="340" rx="12" fill="#f5f9fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#233d50"><text x="28" y="33" font-size="23" fill="#233d50" font-weight="600">Freezing droplets</text><text x="28" y="57" font-size="14" fill="#597382">Aqueous polymer / salt solutions · cooling from below</text><text x="200" y="89" font-size="16" fill="#233d50" font-weight="600" text-anchor="middle">Front motion</text><defs><clipPath id="freezing-drop"><path d="M97 259C102 196 143 114 200 114C257 114 298 196 303 259Z"/></clipPath></defs><path d="M97 259C102 196 143 114 200 114C257 114 298 196 303 259Z" fill="#f8e6c5" stroke="#233d50" stroke-width="2"/><rect x="91" y="207" width="218" height="56" fill="#a8ced8" clip-path="url(#freezing-drop)"/><path d="M112 207H288" stroke="#277782" stroke-width="2" stroke-dasharray="6 4"/><circle cx="152" cy="179" r="3.5" fill="#b9813b"/><circle cx="183" cy="159" r="3.5" fill="#b9813b"/><circle cx="204" cy="186" r="3.5" fill="#b9813b"/><circle cx="232" cy="169" r="3.5" fill="#b9813b"/><circle cx="251" cy="194" r="3.5" fill="#b9813b"/><text x="199" y="147" font-size="14" fill="#233d50" text-anchor="middle">Solution</text><text x="200" y="240" font-size="14" fill="#233d50" text-anchor="middle">Ice</text><rect x="83" y="264" width="234" height="10" rx="2" fill="#879aa5"/><path d="M67 250V195" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#freezing-arrow)"/><text x="30" y="176" font-size="12" fill="#597382">Front</text><text x="30" y="191" font-size="12" fill="#597382">rises</text><path d="M277 207H329" stroke="#597382" stroke-width="1.4"/><text x="338" y="204" font-size="13" fill="#233d50">Ice front</text><text x="200" y="294" font-size="13" fill="#597382" text-anchor="middle">Cold substrate</text><path d="M388 180H432" stroke="#277782" stroke-width="2" fill="none" marker-end="url(#freezing-arrow)"/><text x="541" y="89" font-size="16" fill="#233d50" font-weight="600" text-anchor="middle">Frozen internal geometry</text><path d="M442 259C447 196 488 114 545 114C602 114 643 196 648 259Z" fill="#e0edf0" stroke="#233d50" stroke-width="2"/><path d="M462 257L483 225L486 197L501 168L518 147M481 224L509 210L525 180L538 129M509 210L494 188M525 180L511 164M533 257L548 228L551 199L571 165L577 142M550 201L579 190L597 172M580 257L582 237L604 213L611 188M604 213L622 227L625 257" stroke="#277782" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="428" y="264" width="234" height="10" rx="2" fill="#879aa5"/><text x="545" y="294" font-size="13" fill="#597382" text-anchor="middle">Internal features · schematic</text><rect x="680" y="108" width="195" height="114" rx="7" fill="#e7f1f3" stroke="#afc6ce"/><text x="694" y="132" font-size="12" fill="#277782" font-weight="600">SYNCHROTRON X-RAYS</text><text x="694" y="156" font-size="12" fill="#233d50">Radiography + tomography</text><text x="694" y="180" font-size="12" fill="#233d50">Readout: front dynamics</text><text x="694" y="199" font-size="12" fill="#233d50">and 3D microstructure</text><text x="690" y="250" font-size="12" fill="#597382">Physical state of internal</text><text x="690" y="270" font-size="12" fill="#597382">features is not assigned.</text><text x="28" y="321" font-size="12" fill="#597382">Conceptual schematic · measured images are shown separately.</text></g></svg>