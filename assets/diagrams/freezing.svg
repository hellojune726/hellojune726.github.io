<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="460" viewBox="0 0 1260 460" role="img" aria-labelledby="freezing-full-title freezing-full-desc"><title id="freezing-full-title">Freezing water and aqueous PVA droplets</title><desc id="freezing-full-desc">Three linked conceptual stages show the sample and process, beam and detector, and the measurement readout. No experimental data are shown.</desc><rect x="0" y="0" width="1260" height="460" rx="12" fill="#f4f8fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#243846"><text x="28" y="37" font-size="27" fill="#243846" text-anchor="start" font-weight="600">Freezing water and aqueous PVA droplets</text><circle cx="23" cy="69" r="13" fill="#277782"/><text x="23" y="74" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">1</text><text x="47" y="76" font-size="20" fill="#243846" text-anchor="start" font-weight="600">Cool from below</text><svg x="0" y="94" xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-labelledby="freezing-step1-title freezing-step1-desc"><title id="freezing-step1-title">Cool a solution droplet from below</title><desc id="freezing-step1-desc">An water or aqueous PVA droplet rests on a temperature-controlled substrate. Heat is extracted downward through the stage. The drawing represents the preparation for bottom-up freezing.</desc><rect x="0" y="0" width="400" height="270" rx="12" fill="#f4f8fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#243846"><text x="200" y="34" font-size="21" fill="#243846" text-anchor="middle" font-weight="600">Water or aqueous PVA droplet</text><path d="M123 185 C123 67.96 277 67.96 277 185Z" fill="#edbf65" stroke="#243846" stroke-width="2"/><rect x="56" y="190" width="288" height="29" rx="3" fill="#dceef6" stroke="#7ea4b8" stroke-width="2"/><line x1="148" y1="174" x2="148.0" y2="219.0" stroke="#5b9fbe" stroke-width="3"/><polygon points="148.0,229.0 153.0,219.0 143.0,219.0" fill="#5b9fbe"/><line x1="200" y1="174" x2="200.0" y2="219.0" stroke="#5b9fbe" stroke-width="3"/><polygon points="200.0,229.0 205.0,219.0 195.0,219.0" fill="#5b9fbe"/><line x1="252" y1="174" x2="252.0" y2="219.0" stroke="#5b9fbe" stroke-width="3"/><polygon points="252.0,229.0 257.0,219.0 247.0,219.0" fill="#5b9fbe"/><text x="200" y="257" font-size="17" fill="#243846" text-anchor="middle" font-weight="400">Cooling stage · heat flows down</text></g></svg><text x="8" y="387" font-size="16" fill="#5b7180" text-anchor="start" font-weight="400">Freeze a solution droplet on a cooled substrate.</text><circle cx="453" cy="69" r="13" fill="#277782"/><text x="453" y="74" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">2</text><text x="477" y="76" font-size="20" fill="#243846" text-anchor="start" font-weight="600">Track with X-rays</text><svg x="430" y="94" xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-labelledby="freezing-step2-title freezing-step2-desc"><title id="freezing-step2-title">X-ray imaging of freezing</title><desc id="freezing-step2-desc">A horizontal beam passes through the sample and reaches an imaging detector. The transmitted signal forms a two-dimensional projection. Radiography follows front motion and rotation enables tomography. All beam paths and detector pixels are schematic.</desc><rect x="0" y="0" width="400" height="270" rx="12" fill="#f4f8fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#243846"><text x="73" y="34" font-size="22" fill="#243846" text-anchor="middle" font-weight="600">X-rays</text><text x="336" y="62" font-size="17" fill="#243846" text-anchor="middle" font-weight="400">Detector</text><rect x="13" y="96" width="53" height="85" rx="5" fill="#e7f0f4" stroke="#91aab6" stroke-width="2"/><text x="40" y="204" font-size="13" fill="#5b7180" text-anchor="middle" font-weight="400">Source</text><line x1="67" y1="117" x2="306.0" y2="117.0" stroke="#a8663b" stroke-width="2.5"/><polygon points="316.0,117.0 306.0,112.0 306.0,122.0" fill="#a8663b"/><line x1="67" y1="138" x2="306.0" y2="138.0" stroke="#a8663b" stroke-width="2.5"/><polygon points="316.0,138.0 306.0,133.0 306.0,143.0" fill="#a8663b"/><line x1="67" y1="159" x2="306.0" y2="159.0" stroke="#a8663b" stroke-width="2.5"/><polygon points="316.0,159.0 306.0,154.0 306.0,164.0" fill="#a8663b"/><path d="M136 177 C136 102.52 234 102.52 234 177Z" fill="#edbf65" stroke="#243846" stroke-width="2"/><path d="M137 177V151Q160 143 183 151T233 151V177Z" fill="#dceef6" stroke="#243846" stroke-width="1.5"/><text x="185" y="137" font-size="14" fill="#243846" text-anchor="middle" font-weight="400">Liquid</text><text x="185" y="172" font-size="14" fill="#243846" text-anchor="middle" font-weight="400">Ice</text><rect x="120" y="181" width="132" height="15" rx="2" fill="#dceef6" stroke="#7ea4b8" stroke-width="2"/><line x1="247" y1="148" x2="247.0" y2="132.0" stroke="#5b9fbe" stroke-width="2"/><polygon points="247.0,122.0 242.0,132.0 252.0,132.0" fill="#5b9fbe"/><text x="236" y="101" font-size="15" fill="#5b9fbe" text-anchor="middle" font-weight="400">Front ↑</text><path d="M131 210Q187 240 242 210" fill="none" stroke="#5b7180" stroke-width="2"/><line x1="232" y1="216" x2="234.22104427085617" y2="214.78852130680573" stroke="#5b7180" stroke-width="2"/><polygon points="243.0,210.0 231.8,210.4 236.6,219.2" fill="#5b7180"/><text x="186" y="258" font-size="15" fill="#5b7180" text-anchor="middle" font-weight="400">Rotate for tomography</text><line x1="245" y1="117" x2="306.0" y2="117.0" stroke="#a8663b" stroke-width="1.8"/><polygon points="316.0,117.0 306.0,112.0 306.0,122.0" fill="#a8663b"/><line x1="245" y1="138" x2="306.0" y2="138.0" stroke="#a8663b" stroke-width="1.8"/><polygon points="316.0,138.0 306.0,133.0 306.0,143.0" fill="#a8663b"/><line x1="245" y1="159" x2="306.0" y2="159.0" stroke="#a8663b" stroke-width="1.8"/><polygon points="316.0,159.0 306.0,154.0 306.0,164.0" fill="#a8663b"/><rect x="317" y="90" width="29" height="111" rx="3" fill="#dcecf1" stroke="#243846" stroke-width="2"/><rect x="322" y="98" width="7" height="17" rx="0" fill="#c4dbe2"/><rect x="332" y="98" width="7" height="17" rx="0" fill="#87b4c1"/><rect x="322" y="121" width="7" height="17" rx="0" fill="#87b4c1"/><rect x="332" y="121" width="7" height="17" rx="0" fill="#c4dbe2"/><rect x="322" y="144" width="7" height="17" rx="0" fill="#c4dbe2"/><rect x="332" y="144" width="7" height="17" rx="0" fill="#87b4c1"/><rect x="322" y="167" width="7" height="17" rx="0" fill="#87b4c1"/><rect x="332" y="167" width="7" height="17" rx="0" fill="#c4dbe2"/></g></svg><text x="438" y="387" font-size="16" fill="#5b7180" text-anchor="start" font-weight="400">Track the front; rotate the sample for</text><text x="438" y="407" font-size="16" fill="#5b7180" text-anchor="start" font-weight="400">tomography.</text><circle cx="883" cy="69" r="13" fill="#277782"/><text x="883" y="74" font-size="15" fill="#fff" text-anchor="middle" font-weight="600">3</text><text x="907" y="76" font-size="20" fill="#243846" text-anchor="start" font-weight="600">Resolve structure and chemistry</text><svg x="860" y="94" xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-labelledby="freezing-step3-title freezing-step3-desc"><title id="freezing-step3-title">Measure geometry and relative chemical signal</title><desc id="freezing-step3-desc">X-ray tomography provides three-dimensional internal geometry. Raman mapping independently provides relative PVA-associated signal for polymer droplets. The internal features have no assigned physical state; the picture is conceptual.</desc><rect x="0" y="0" width="400" height="270" rx="12" fill="#f4f8fa"/><g font-family="Arial, Helvetica, sans-serif" fill="#243846"><text x="102" y="47" font-size="21" fill="#243846" text-anchor="middle" font-weight="600">X-ray CT</text><text x="303" y="47" font-size="21" fill="#243846" text-anchor="middle" font-weight="600">Raman</text><path d="M38 196C38 118 65 86 102 86C139 86 166 118 166 196Z" fill="#dceef6" stroke="#243846" stroke-width="2"/><ellipse cx="102" cy="195" rx="64" ry="12" fill="#eaf4f8" stroke="#243846" stroke-width="2"/><path d="M100 190V132L77 113M100 146L125 123M100 171L67 150M100 158L139 165M77 113L65 99M125 123L133 99" fill="none" stroke="#277782" stroke-width="5" stroke-linecap="round"/><rect x="234" y="88" width="138" height="122" rx="3" fill="#f7e8da" stroke="#c6a794" stroke-width="2"/><path d="M255 177C243 152 269 132 280 139C291 147 291 169 281 185Z" fill="#bc6e91"/><path d="M291 119C285 95 338 101 340 124C343 144 321 155 305 143Z" fill="#a64f7a"/><text x="102" y="242" font-size="17" fill="#243846" text-anchor="middle" font-weight="400">3D geometry</text><text x="303" y="242" font-size="16" fill="#243846" text-anchor="middle" font-weight="400">Relative PVA signal</text></g></svg><text x="868" y="387" font-size="16" fill="#5b7180" text-anchor="start" font-weight="400">CT resolves geometry; Raman maps relative PVA</text><text x="868" y="407" font-size="16" fill="#5b7180" text-anchor="start" font-weight="400">signal.</text><text x="28" y="441" font-size="16" fill="#5b7180" text-anchor="start" font-weight="400">Conceptual illustration · sample → imaging → readout</text></g></svg>