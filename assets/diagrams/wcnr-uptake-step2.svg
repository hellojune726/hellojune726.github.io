middle" fill="#243846">Source</text><text x="171" y="218" font-size="18" font-weight="400" text-anchor="middle" fill="#243846">D₂O</text><text x="325" y="218" font-size="17" font-weight="400" text-anchor="middle" fill="#243846">Detector</text><path d="M150 181H192M150 177V185M192 177V185" fill="none" stroke="#243846" stroke-width="1.5"/><text x="171" y="171" font-size="17" font-weight="400" text-anchor="middle" fill="#243846">d</text><text x="200" y="250" font-size="18" font-weight="400" text-anchor="middle" fill="#243846">H / D give different attenuation</text></g></svg>