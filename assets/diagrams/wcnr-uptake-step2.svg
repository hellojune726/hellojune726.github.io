<svg xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-labelledby="wcnr-step2-title wcnr-step2-desc">
<title id="wcnr-step2-title">Measure neutron transmission through a D2O capillary</title><desc id="wcnr-step2-desc">A neutron source illuminates a D2O-filled capillary of known path length d. The detector records transmitted intensity I relative to incident intensity I0. Hydrogen and deuterium give different neutron attenuation; the beam and pixels are conceptual.</desc>
<defs><marker id="wcnr-step2-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#277782"/></marker></defs>
<rect width="400" height="270" rx="12" fill="#f4f8fa"/>
