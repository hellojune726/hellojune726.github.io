<svg xmlns="http://www.w3.org/2000/svg" width="400" height="270" viewBox="0 0 400 270" role="img" aria-labelledby="wcnr-step1-title wcnr-step1-desc">
<title id="wcnr-step1-title">Expose D2O droplets and capillaries to ambient water vapor</title><desc id="wcnr-step1-desc">Uniform D2O droplets on and below a substrate, plus D2O-filled capillaries with either their top or bottom end open, exchange water with humid ambient air. Arrows show vapor entry and downward gravity; these are sample geometries, not measured distributions.</desc>
<defs><marker id="wcnr-step1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#277782"/></marker></defs>
<rect width="400" height="270" rx="12" fill="#f4f8fa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243846"><text x="200" y="30" font-size="21" font-weight="600" text-anchor="middle" fill="#243846">Ambient H₂O vapor → D₂O</text><text x="106" y="61" font-size="18" font-weight="600" text-anchor="middle" fill="#243846">Droplets</text><text x="282" y="61" font-size="18" font-weight="600" text-anchor="middle" fill="#243846">Capillaries</text><path d="M27 151C27 103 87 103 87 151Z" fill="#edbf65" stroke="#243846" stroke-width="2"/><rect x="18" y="155" width="78" height="6" rx="2" fill="#8299a4"/><rect x="117" y="99" width="78" height="6" rx="2" fill="#8299a4"/><path d="M126 109H186C186 163 126 163 126 109Z" fill="#edbf65" stroke="#243846" stroke-width="2"/><text x="57" y="190" font-size="17" font-weight="400" text-anchor="middle" fill="#243846">Sessile</text><text x="156" y="190" font-size="17" font-weight="400" text-anchor="middle" fill="#243846">Pendant</text><circle cx="43" cy="81" r="4" fill="#88b9c6"/><circle cx="75" cy="86" r="4" fill="#88b9c6"/><circle cx="147" cy="171" r="4" fill="#88b9c6"/><circle cx="174" cy="174" r="4" fill="#88b9c6"/><circle cx="246" cy="79" r="4" fill="#88b9c6"/><circle cx="312" cy="213" r="4" fill="#88b9c6"/><path d="M51 91L57 120" fill="none" stroke="#277782" stroke-width="2.2" marker-end="url(#wcnr-step1-arrow)"/><path d="M156 168L156 145" fill="none" stroke="#277782" stroke-width="2.2" marker-end="url(#wcnr-step1-arrow)"/><rect x="234" y="111" width="25" height="70" fill="#edbf65"/><path d="M230 104V185H263V104" fill="none" stroke="#243846" stroke-width="3"/><rect x="300" y="111" width="25" height="70" fill="#edbf65"/><path d="M296 185V104H329V185" fill="none" stroke="#243846" stroke-width="3"/><path d="M246.5 87L246.5 104" fill="none" stroke="#277782" stroke-width="2.2" marker-end="url(#wcnr-step1-arrow)"/><path d="M312.5 204L312.5 185" fill="none" stroke="#277782" stroke-width="2.2" marker-end="url(#wcnr-step1-arrow)"/><text x="247" y="219" font-size="16" font-weight="400" text-anchor="middle" fill="#243846">Top open</text><text x="313" y="239" font-size="16" font-weight="400" text-anchor="middle" fill="#243846">Bottom open</text><path d="M363 108L363 163" fill="none" stroke="#277782" stroke-width="2.2" marker-end="url(#wcnr-step1-arrow)"/><text x="363" y="95" font-size="19" font-weight="400" text-anchor="middle" fill="#243846">g</text><text x="124" y="246" font-size="17" font-weight="400" text-anchor="middle" fill="#243846">Evaporation + uptake</text></g></svg>